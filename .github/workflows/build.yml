name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          mkdir -p www
          cp index.html www/index.html
          if [ -f adhan.mp3 ]; then cp adhan.mp3 www/adhan.mp3; fi
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7
          npx cap init Misk com.misk.app --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Patch Android (permissions, name, adhan sound)
        run: |
          python3 - <<'EOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          perms = ''.join(f'    <uses-permission android:name="android.permission.{x}" />\n' for x in [
            'ACCESS_FINE_LOCATION','ACCESS_COARSE_LOCATION','POST_NOTIFICATIONS',
            'SCHEDULE_EXACT_ALARM','USE_EXACT_ALARM','WAKE_LOCK','VIBRATE',
            'RECEIVE_BOOT_COMPLETED','MODIFY_AUDIO_SETTINGS'])
          s = s.replace('<application', perms + '    <application', 1)
          open(p, 'w', encoding='utf-8').write(s)
          sp = 'android/app/src/main/res/values/strings.xml'
          t = open(sp, encoding='utf-8').read()
          t = t.replace('<string name="app_name">Misk</string>', '<string name="app_name">مسك</string>')
          t = t.replace('<string name="title_activity_main">Misk</string>', '<string name="title_activity_main">مسك</string>')
          open(sp, 'w', encoding='utf-8').write(t)
          EOF
          mkdir -p android/app/src/main/res/raw
          if [ -f adhan.mp3 ]; then cp adhan.mp3 android/app/src/main/res/raw/adhan.mp3; fi

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: misk-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
